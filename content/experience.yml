- company: Universidad Andrés Bello
  companyUrl: https://www.unab.cl/
  position:
    es: Desarrollador Full Stack — Práctica Profesional
    en: Full Stack Developer — Professional Internship
    de: Full-Stack-Entwickler — Berufspraktikum
  description:
    es: >-
      Desarrollo de plataforma anti-plagio integrada en Canvas (LMS) para evaluaciones de programación. Cada sesión corre
      en un contenedor Docker aislado por estudiante, orquestado en AWS EC2 y Lambda. Sistema de trazabilidad en tiempo
      real que registra y bloquea intentos de copiar/pegar/cortar y cambios de pestaña. Evaluaciones configurables en
      pantalla completa con cierre automático al salir. Chatbot RAG con Ollama + Qwen en servidor dedicado. Landing page
      en Astro desplegada en Vercel. Todo el código orientado a cumplir OWASP Top 10. Metodología Scrum con Taiga.
    en: >-
      Developed an anti-plagiarism platform integrated into Canvas (LMS) for programming assessments. Each session runs
      in an isolated Docker container per student, orchestrated on AWS EC2 and Lambda. Real-time traceability system
      logging and blocking copy/paste/cut attempts and tab switches. Fullscreen-enforced assessments with automatic
      closure on exit. RAG chatbot built on Ollama + Qwen on a dedicated server. Landing page built with Astro and
      deployed on Vercel. All code aligned with OWASP Top 10. Scrum methodology using Taiga.
    de: >-
      Entwicklung einer Anti-Plagiat-Plattform, integriert in Canvas (LMS) für Programmierprüfungen. Jede Sitzung läuft
      in einem isolierten Docker-Container pro Student, orchestriert auf AWS EC2 und Lambda. Echtzeit-Rückverfolgungssystem
      für Kopier- und Tab-Wechsel-Versuche. Scrum-Methodik mit Taiga.
  start: "2026-01"
  end: "2026-02"
  location: Viña del Mar, Valparaíso, Chile
  technologies: [Python, FastAPI, Vue.js, PostgreSQL, Docker, AWS, Ollama, Rag, Astro, Vercel, OWASP]

