      dashboard. Multilevel alerts via email and WhatsApp (Twilio). ML predictions using linear regression. 2nd place
      out of 20 projects at ExpoSmart 2025 for innovation and technical viability.
    de: >-
      Leitung des Entwurfs und der Entwicklung eines IoT-Wasserüberwachungssystems in Echtzeit für Blaubeerplantagen.
      2 solarbetriebene Knoten mit pH-, Leitfähigkeits- und Temperatursensoren. 2. Platz unter 20 Projekten bei
      ExpoSmart 2025.
