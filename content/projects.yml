- title: AquaStat
  description:
    es: >-
      AquaStat es una solución tecnológica diseñada para optimizar el uso de recursos hídricos en el cultivo de
      arándanos en Chile. Su propósito es transitar de una gestión hídrica reactiva a una proactiva basada en datos en
      tiempo real, permitiendo reducir costos operativos de energía y agua.
    en: >-
      AquaStat is a technological solution designed to optimize water resource use in Chilean blueberry farming. Its
      purpose is to transition from reactive to proactive water management based on real-time data, allowing for
      reduced energy and water operational costs.
    de: >-
      AquaStat ist eine technologische Lösung zur Optimierung der Wassernutzung im chilenischen Blaubeeranbau. Ihr Ziel
      ist der Übergang von einem reaktiven zu einem proaktiven Wassermanagement auf Basis von Echtzeitdaten, um die
      Betriebskosten für Energie und Wasser zu senken.
  image: /images/projects/aquastat.webp
  link: https://aquastat.exposmart.cl/
  github: https://github.com/KsmBlitz/UNAB-ProyectoDeTitulo
  technologies: [ESP32, MQTT, AWS, FastAPI, Vue.js, Mongo Atlas, Docker]

